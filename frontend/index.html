<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cornerstone Homes · DealBench</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;450;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --ink: #16233A;        /* architectural navy */
      --ink-soft: #3A465C;
      --ink-mute: #6B7385;
      --brass: #B0812B;      /* cornerstone plaque brass */
      --brass-deep: #8A6320;
      --brass-tint: #F3ECDC;
      --paper: #ECE9E1;      /* warm limestone canvas */
      --card: #FBFAF6;
      --line: #DED9CC;
      --line-soft: #E9E5DA;
      --pine: #2E6E63;       /* the BUYER side — your agent */
      --pine-tint: #E1EEEA;
      --clay: #A9713C;       /* seller fallback accent */
      --clay-tint: #F1E6DB;
      --good: #2C7A57;
      --good-tint: #DCEEE4;
      --warn: #9A6B15;
      --warn-tint: #F6ECD3;
      --bad: #A93B31;
      --bad-tint: #F5DED9;
      --shadow: 0 1px 2px rgba(22,35,58,.06), 0 8px 24px -12px rgba(22,35,58,.18);
      --shadow-lg: 0 24px 60px -28px rgba(22,35,58,.45);
      --radius: 14px;
      --radius-sm: 9px;
      --maxw: 1180px;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.55;
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4 { font-family: "Bricolage Grotesque", "Inter", sans-serif; margin: 0; letter-spacing: -0.01em; line-height: 1.08; }
    a { color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2.5px solid var(--brass); outline-offset: 2px;
    }
    .mono { font-family: "Space Mono", ui-monospace, monospace; font-feature-settings: "tnum" 1; }
    .kicker {
      font-family: "Space Mono", monospace; font-size: 11px; font-weight: 700;
      letter-spacing: 0.16em; text-transform: uppercase; color: var(--brass-deep);
    }

    /* ---------- top bar ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 40;
      background: var(--ink); color: #F4F2EC;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .topbar-in {
      max-width: var(--maxw); margin: 0 auto; padding: 0 22px;
      height: 62px; display: flex; align-items: center; gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 11px; cursor: pointer; background: none; border: 0; color: inherit; padding: 6px 0; }
    .brand-mark {
      width: 30px; height: 30px; border-radius: 6px; flex: none;
      background: linear-gradient(150deg, var(--brass) 0%, var(--brass-deep) 100%);
      display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
    }
    .brand-mark svg { width: 17px; height: 17px; display: block; }
    .brand-name { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.02em; }
    .brand-sub { font-family: "Space Mono", monospace; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #A7B0C2; margin-top: -2px; }
    .topbar-spacer { flex: 1; }

    /* ---------- status pill (live / mock) ---------- */
    .statuswrap { position: relative; }
    .status-pill {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
      color: #EDEAE2; padding: 7px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    }
    .status-pill:hover { background: rgba(255,255,255,.12); }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .dot.live { background: #57D9A3; box-shadow: 0 0 0 3px rgba(87,217,163,.25); }
    .dot.mock { background: #E4B34A; box-shadow: 0 0 0 3px rgba(228,179,74,.22); }
    .dot.unknown { background: #8894A8; }
    .popover {
      position: absolute; right: 0; top: 48px; width: 340px; z-index: 60;
      background: var(--card); color: var(--ink); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 16px;
    }
    .popover h4 { font-size: 15px; margin-bottom: 4px; }
    .probe-row { display: flex; align-items: baseline; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line-soft); font-size: 13px; }
    .probe-row .role { width: 74px; color: var(--ink-mute); text-transform: capitalize; }
    .probe-ok { color: var(--good); font-weight: 600; }
    .probe-bad { color: var(--bad); font-weight: 600; }

    /* ---------- layout ---------- */
    .wrap { max-width: var(--maxw); margin: 0 auto; padding: 30px 22px 80px; }
    .backlink { background: none; border: 0; color: var(--ink-soft); font-weight: 600; font-size: 13.5px; padding: 6px 0; display: inline-flex; align-items: center; gap: 7px; }
    .backlink:hover { color: var(--brass-deep); }

    /* ---------- buttons ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 1px solid transparent; border-radius: var(--radius-sm);
      padding: 11px 18px; font-size: 14.5px; font-weight: 600; transition: .16s ease;
    }
    .btn-primary { background: var(--brass); color: #fff; box-shadow: 0 1px 0 var(--brass-deep); }
    .btn-primary:hover { background: var(--brass-deep); }
    .btn-ink { background: var(--ink); color: #F4F2EC; }
    .btn-ink:hover { background: #0E1830; }
    .btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
    .btn-ghost:hover { border-color: var(--ink-soft); background: #fff; }
    .btn-danger { background: transparent; border-color: var(--bad); color: var(--bad); }
    .btn-danger:hover { background: var(--bad-tint); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-block { width: 100%; }
    .btn-sm { padding: 8px 13px; font-size: 13px; }

    /* ---------- gallery hero ---------- */
    .hero { display: grid; grid-template-columns: 1.15fr .85fr; gap: 34px; align-items: end; margin-bottom: 30px; }
    .hero h1 { font-size: clamp(34px, 5vw, 56px); font-weight: 800; }
    .hero h1 em { font-style: normal; color: var(--brass-deep); }
    .hero p { font-size: 17px; color: var(--ink-soft); max-width: 46ch; margin: 16px 0 0; }
    .hero-facts { display: flex; gap: 26px; padding: 18px 20px; background: var(--ink); color: #EDEAE2; border-radius: var(--radius); }
    .hero-fact .n { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 26px; display: block; }
    .hero-fact .l { font-family: "Space Mono", monospace; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #A7B0C2; }
    .rule { display: flex; align-items: center; gap: 14px; margin: 6px 0 22px; }
    .rule .line { height: 1px; background: var(--line); flex: 1; }

    /* ---------- listing grid ---------- */
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
    .listing { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); text-align: left; padding: 0; transition: transform .18s ease, box-shadow .18s ease; display: flex; flex-direction: column; }
    .listing:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .listing-photo { position: relative; aspect-ratio: 8/5; overflow: hidden; }
    .listing-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .accent-bar { height: 4px; }
    .listing-tag { position: absolute; top: 12px; left: 12px; background: rgba(22,35,58,.86); color: #fff; font-family: "Space Mono", monospace; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; padding: 5px 9px; border-radius: 6px; }
    .listing-body { padding: 15px 17px 17px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .listing-addr { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 18px; }
    .listing-hood { color: var(--ink-mute); font-size: 12.5px; margin-top: -4px; }
    .spec-chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 2px; }
    .chip { font-size: 12px; color: var(--ink-soft); background: #F1EEE6; border: 1px solid var(--line-soft); border-radius: 999px; padding: 3px 9px; }
    .listing-foot { display: flex; align-items: baseline; justify-content: space-between; margin-top: auto; padding-top: 8px; }
    .price { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 21px; }
    .price-sm { font-family: "Space Mono", monospace; font-size: 12px; color: var(--ink-mute); }

    /* ---------- detail ---------- */
    .detail { display: grid; grid-template-columns: 1.4fr 1fr; gap: 30px; align-items: start; }
    .detail-photo { border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--line); }
    .detail-photo img { width: 100%; display: block; aspect-ratio: 8/5; object-fit: cover; }
    .detail h1 { font-size: 32px; font-weight: 800; margin-top: 10px; }
    .detail .desc { color: var(--ink-soft); margin: 14px 0; }
    .feature-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; padding: 0; list-style: none; }
    .feature-list li { font-size: 13px; background: var(--brass-tint); color: var(--brass-deep); border-radius: 8px; padding: 5px 10px; font-weight: 500; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .offer-card { padding: 22px; position: sticky; top: 84px; }
    .offer-card h3 { font-size: 20px; }
    .field { margin: 15px 0; }
    .field label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
    .field .hint { color: var(--ink-mute); font-size: 12px; font-weight: 400; }
    .input { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); font-size: 15px; font-family: "Space Mono", monospace; background: #fff; color: var(--ink); }
    .seg { display: flex; gap: 8px; }
    .seg button { flex: 1; padding: 10px 8px; border: 1px solid var(--line); background: #fff; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; color: var(--ink-soft); }
    .seg button.on { border-color: var(--pine); background: var(--pine-tint); color: var(--pine); }
    .spec-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .spec-table td { padding: 8px 0; border-top: 1px solid var(--line-soft); font-size: 13.5px; }
    .spec-table td:first-child { color: var(--ink-mute); }
    .spec-table td:last-child { text-align: right; font-weight: 600; }

    /* ---------- negotiation room ---------- */
    .room-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .room-head h1 { font-size: 25px; font-weight: 800; }
    .room-head .meta { color: var(--ink-mute); font-size: 13px; }
    .prov { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line); }
    .prov.live { background: var(--good-tint); color: var(--good); border-color: transparent; }
    .prov.mock { background: var(--warn-tint); color: var(--warn); border-color: transparent; }
    .prov.ollama { background: var(--pine-tint); color: var(--pine); border-color: transparent; }
    .room { display: grid; grid-template-columns: 1fr 372px; gap: 22px; align-items: start; }

    .transcript { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 8px; height: 66vh; min-height: 460px; overflow-y: auto; scroll-behavior: smooth; }
    .stream-empty { color: var(--ink-mute); text-align: center; padding: 60px 20px; }
    .msg { max-width: 82%; margin: 14px 8px; }
    .msg.buyer { margin-right: auto; }
    .msg.seller { margin-left: auto; }
    .msg-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 11px; margin-bottom: 5px; color: var(--ink-mute); }
    .msg.seller .msg-meta { justify-content: flex-end; }
    .who { font-family: "Space Mono", monospace; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 10.5px; }
    .msg.buyer .who { color: var(--pine); }
    .msg.seller .who { color: var(--clay); }
    .bubble { padding: 12px 15px; border-radius: 15px; font-size: 14.5px; box-shadow: var(--shadow); }
    .msg.buyer .bubble { background: var(--pine-tint); border-bottom-left-radius: 4px; }
    .msg.seller .bubble { background: #fff; border: 1px solid var(--line); border-bottom-right-radius: 4px; }
    .msg.human .bubble { background: var(--ink); color: #F1EFE9; }
    .tag-mini { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; font-family: "Space Mono", monospace; }
    .tag-offer { background: var(--brass-tint); color: var(--brass-deep); }
    .tag-tactic { background: #ECEEF2; color: var(--ink-soft); }
    .tag-you { background: var(--ink); color: #fff; }
    .tag-src { background: transparent; border: 1px solid var(--line); color: var(--ink-mute); }
    .tag-leak { background: var(--bad); color: #fff; }
    .typing .bubble { display: inline-flex; gap: 4px; padding: 14px 15px; }
    .typing .bubble span { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-mute); opacity: .5; animation: blink 1.1s infinite; }
    .typing .bubble span:nth-child(2) { animation-delay: .18s; }
    .typing .bubble span:nth-child(3) { animation-delay: .36s; }
    @keyframes blink { 0%,80%,100% { opacity: .25; transform: translateY(0); } 40% { opacity: .9; transform: translateY(-3px); } }

    /* ---------- right rail ---------- */
    .rail { display: flex; flex-direction: column; gap: 18px; position: sticky; top: 84px; }
    .panel { padding: 18px; }
    .panel h3 { font-size: 13px; font-family: "Space Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-mute); font-weight: 700; margin-bottom: 14px; }

    /* signature: deal ledger */
    .ledger-nums { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .ledger-num .l { font-size: 11px; font-family: "Space Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
    .ledger-num .v { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 20px; }
    .ledger-num.seller { text-align: right; }
    .ledger-num.buyer .l { color: var(--pine); }
    .ledger-num.seller .l { color: var(--clay); }
    .track { position: relative; height: 44px; margin: 18px 0 8px; }
    .track-line { position: absolute; top: 50%; left: 0; right: 0; height: 3px; background: var(--line); border-radius: 2px; transform: translateY(-50%); }
    .track-fill { position: absolute; top: 50%; height: 3px; background: linear-gradient(90deg, var(--pine), var(--clay)); border-radius: 2px; transform: translateY(-50%); transition: left .5s ease, right .5s ease; }
    .marker { position: absolute; top: 50%; transform: translate(-50%, -50%); transition: left .5s cubic-bezier(.4,0,.2,1); }
    .marker .pin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #fff; box-shadow: var(--shadow); }
    .marker.buyer .pin { background: var(--pine); }
    .marker.seller .pin { background: var(--clay); }
    .marker.settle { top: 50%; }
    .marker.settle .pin { width: 14px; height: 14px; background: var(--brass); border-radius: 3px; transform: rotate(45deg); }
    .marker .cap { position: absolute; left: 50%; transform: translateX(-50%); top: 20px; white-space: nowrap; font-family: "Space Mono", monospace; font-size: 10px; color: var(--ink-mute); }
    .gap-note { text-align: center; font-size: 12.5px; color: var(--ink-soft); }
    .gap-note b { font-family: "Space Mono", monospace; }

    .state-line { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line-soft); font-size: 13px; }
    .state-line .k { color: var(--ink-mute); }
    .state-line .v { font-weight: 600; }
    .pill-turn { font-family: "Space Mono", monospace; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--brass-tint); color: var(--brass-deep); font-weight: 700; }

    .approval { border: 1.5px solid var(--warn); background: var(--warn-tint); }
    .approval h3 { color: var(--warn); }
    .gate { font-size: 13px; padding: 8px 10px; background: #fff; border-radius: 8px; margin-bottom: 7px; }
    .gate b { text-transform: capitalize; }
    .textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; resize: vertical; min-height: 68px; background: #fff; }
    .stack { display: flex; flex-direction: column; gap: 9px; }
    .banner { padding: 16px 18px; border-radius: var(--radius); }
    .banner.agreed { background: var(--good-tint); border: 1px solid var(--good); }
    .banner.walked_away, .banner.max_rounds { background: var(--bad-tint); border: 1px solid var(--bad); }
    .banner h3 { font-family: "Bricolage Grotesque"; text-transform: none; letter-spacing: normal; font-size: 18px; color: var(--ink); margin-bottom: 4px; }
    .banner .big { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 30px; }

    /* ---------- report ---------- */
    .report-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 18px; }
    .stat { padding: 18px 20px; }
    .stat .l { font-family: "Space Mono", monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-mute); }
    .stat .v { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 30px; margin-top: 4px; }
    .zopa { position: relative; height: 60px; margin: 22px 0 30px; }
    .zopa-band { position: absolute; top: 18px; height: 14px; background: var(--pine-tint); border-radius: 7px; border: 1px solid var(--pine); }
    .zopa-settle { position: absolute; top: 8px; width: 3px; height: 34px; background: var(--brass); }
    .zopa-lab { position: absolute; top: 38px; font-family: "Space Mono", monospace; font-size: 10.5px; color: var(--ink-mute); transform: translateX(-50%); }
    .split-bar { display: flex; height: 30px; border-radius: 8px; overflow: hidden; margin-top: 6px; border: 1px solid var(--line); }
    .split-buyer { background: var(--pine); color: #fff; }
    .split-seller { background: var(--clay); color: #fff; }
    .split-seg { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; font-family: "Space Mono", monospace; }
    .tactic-cols { display: flex; gap: 24px; }
    .tactic-cols > div { flex: 1; }
    .integrity-ok { color: var(--good); font-weight: 700; }
    .integrity-bad { color: var(--bad); font-weight: 700; }

    .alert { padding: 12px 15px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 14px; }
    .alert-error { background: var(--bad-tint); color: var(--bad); border: 1px solid var(--bad); }

    @media (max-width: 940px) {
      .hero, .detail, .room, .report-grid { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(2, 1fr); }
      .offer-card, .rail { position: static; }
      .rail { flex-direction: column; }
    }
    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      .msg { max-width: 92%; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?external=react",
        "htm": "https://esm.sh/htm@3.1.1"
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React, { useState, useEffect, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import htm from 'htm';
    const html = htm.bind(React.createElement);

    // ------------------------------------------------------------------ utils
    async function api(path, opts) {
      const res = await fetch(path, opts);
      let data = null;
      try { data = await res.json(); } catch (e) { /* empty body */ }
      if (!res.ok && !(data && data.awaiting_approval)) {
        throw new Error((data && data.error) || (res.status + ' ' + res.statusText));
      }
      return data;
    }
    const fmt = (n, cur = '$') =>
      (n === null || n === undefined || isNaN(n)) ? '—' : cur + Math.round(n).toLocaleString('en-US');
    const cx = (...a) => a.filter(Boolean).join(' ');

    const HouseMark = () => html`<svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3.2 9.6 12 3.6l8.8 6v10.2a.9.9 0 0 1-.9.9h-4.7v-5.9H8.8v5.9H4.1a.9.9 0 0 1-.9-.9Z"
            fill="#fff" fill-opacity=".94"/></svg>`;

    const WHO = { buyer: 'Your agent', seller: 'Cornerstone', };
    const OUTCOME = {
      agreed: 'Deal agreed', walked_away: 'Walked away — no deal',
      max_rounds: 'Reached the round cap — no deal', active: 'In progress',
    };

    // Truthful provenance: what ACTUALLY produced the chat so far.
    function provenance(s) {
      const backs = new Set((s.history || []).filter(m => m.source === 'agent').map(m => m.backend));
      if (backs.has('openrouter')) return { mode: 'live', label: 'Live · OpenRouter' };
      if (backs.has('ollama')) return { mode: 'ollama', label: 'Local · Ollama' };
      if (backs.has('mock')) return {
        mode: 'mock', label: 'Offline narrator',
        reason: s.narration_reason && (s.narration_reason.buyer || s.narration_reason.seller),
      };
      return s.live_llm ? { mode: 'live', label: 'Live API ready' } : { mode: 'mock', label: 'Offline narrator' };
    }

    function ledgerDomain(s) {
      const asking = s.property ? s.property.asking_price : null;
      const prices = (s.history || []).filter(m => m.quoted_price != null).map(m => m.quoted_price);
      const extra = [s.offers.buyer, s.offers.seller, asking].filter(v => v != null);
      const all = prices.concat(extra);
      if (!all.length) return null;
      let hi = Math.max(...all), lo = Math.min(...all);
      if (asking) { hi = Math.max(hi, asking); lo = Math.min(lo, asking * 0.8); }
      if (hi <= lo) hi = lo + 1;
      const pad = (hi - lo) * 0.08;
      return { lo: lo - pad, hi: hi + pad };
    }
    const posOf = (v, d) => Math.max(0, Math.min(100, ((v - d.lo) / (d.hi - d.lo)) * 100));

    // =============================================================== StatusPill
    function StatusPill({ llm, probing, onProbe }) {
      const [open, setOpen] = useState(false);
      const live = llm && llm.config && llm.config.expected_mode === 'live';
      const verdict = llm && llm.verdict; // set after a probe
      const dotClass = !llm ? 'unknown' : (verdict === 'mock' ? 'mock' : live ? 'live' : 'mock');
      const label = !llm ? 'Checking…'
        : verdict === 'live' ? 'Live API confirmed'
        : verdict === 'partial' ? 'One model down'
        : verdict === 'mock' ? 'Offline narrator'
        : live ? 'Live API ready' : 'Offline narrator';
      return html`<div className="statuswrap">
        <button className="status-pill" onClick=${() => setOpen(o => !o)} aria-expanded=${open}>
          <span className=${cx('dot', dotClass)}></span>${label}
          <span style=${{ opacity: .6, fontSize: '11px' }}>▾</span>
        </button>
        ${open && html`<div className="popover">
          <h4>Model connection</h4>
          <p style=${{ fontSize: '13px', color: 'var(--ink-mute)', margin: '2px 0 12px' }}>
            Whether negotiations stream real chat from OpenRouter, or fall back to the built-in offline narrator.
          </p>
          ${llm && llm.config && html`<div style=${{ fontSize: '12.5px', marginBottom: '10px' }}>
            <div className="probe-row" style=${{ borderTop: 'none' }}><span className="role">Key</span><span>${llm.config.key_present ? 'present' : 'not set'}</span></div>
            <div className="probe-row"><span className="role">Buyer</span><span className="mono" style=${{ fontSize: '11.5px' }}>${llm.config.buyer_model}</span></div>
            <div className="probe-row"><span className="role">Seller</span><span className="mono" style=${{ fontSize: '11.5px' }}>${llm.config.seller_model}</span></div>
          </div>`}
          ${llm && llm.checks && html`<div style=${{ marginBottom: '10px' }}>
            ${['buyer', 'seller', 'classifier'].map(r => llm.checks[r] && html`<div key=${r} className="probe-row">
              <span className="role">${r}</span>
              ${llm.checks[r].ok
                ? html`<span className="probe-ok">✓ ${Math.round(llm.checks[r].latency_ms)} ms</span>`
                : html`<span className="probe-bad" title=${llm.checks[r].error}>✗ failed</span>`}
            </div>`)}
          </div>`}
          ${llm && llm.reason && html`<p style=${{ fontSize: '12.5px', color: 'var(--ink-soft)' }}>${llm.reason}</p>`}
          <button className="btn btn-ghost btn-sm btn-block" onClick=${onProbe} disabled=${probing}>
            ${probing ? 'Testing…' : 'Test connection now'}
          </button>
        </div>`}
      </div>`;
    }

    // =================================================================== Gallery
    function Gallery({ properties, onOpen }) {
      const count = properties.length;
      const avg = count ? Math.round(properties.reduce((a, p) => a + p.asking_price, 0) / count) : 0;
      return html`<div className="wrap">
        <div className="hero">
          <div>
            <div className="kicker">Cornerstone Homes · Marlowe Ridge</div>
            <h1 style=${{ marginTop: '10px' }}>Homes built to last.<br/><em>Deals done in the open.</em></h1>
            <p>Browse our new-build collection, then send your own negotiating agent to the table.
               Every counter is on the record — and you can step in whenever you like.</p>
          </div>
          <div className="hero-facts">
            <div className="hero-fact"><span className="n">${count}</span><span className="l">Homes listed</span></div>
            <div className="hero-fact"><span className="n mono">${fmt(avg)}</span><span className="l">Avg. asking</span></div>
            <div className="hero-fact"><span className="n">2</span><span className="l">Agents at the table</span></div>
          </div>
        </div>
        <div className="rule"><span className="kicker">Available now</span><span className="line"></span></div>
        <div className="grid">
          ${properties.map(p => html`<button key=${p.id} className="listing" onClick=${() => onOpen(p)}>
            <div className="listing-photo">
              <img src=${p.photo} alt=${p.address} loading="lazy" />
              <span className="listing-tag">${p.days_on_market} days on market</span>

            <div className="listing-body">
              <div>
                <div className="listing-addr">${p.address}</div>
                <div className="listing-hood">${p.type} · ${p.neighborhood}</div>
              </div>
              <div className="spec-chips">
                <span className="chip">${p.beds} bd</span>
                <span className="chip">${p.baths} ba</span>
                <span className="chip">${p.sqft.toLocaleString()} sqft</span>
              </div>
              <div className="listing-foot">
                <span className="price">${fmt(p.asking_price)}</span>
                <span className="price-sm">${fmt(p.price_per_sqft)}/sqft</span>
              </div>
            </div>
          </button>`)}
        </div>
      </div>`;
    }

    // ==================================================================== Detail
    function Detail({ property: p, onBack, onEngage }) {
      const [budget, setBudget] = useState(String(p.asking_price));
      const [control, setControl] = useState('autopilot');
      const [cap, setCap] = useState('');
      const specs = [
        ['Type', p.type], ['Bedrooms', p.beds], ['Bathrooms', p.baths],
        ['Interior', p.sqft.toLocaleString() + ' sqft'],
        ['Lot', p.lot_sqft ? p.lot_sqft.toLocaleString() + ' sqft' : '—'],
        ['Year built', p.year_built], ['Garage', p.garage + ' car'],
        ['HOA', p.hoa_month ? fmt(p.hoa_month) + '/mo' : 'None'],
        ['Price / sqft', fmt(p.price_per_sqft)],
      ];
      const engage = () => onEngage({
        reservation: Number(budget) || p.asking_price,
        control,
        budgetCap: cap.trim() ? Number(cap) : null,
      });
      return html`<div className="wrap">
        <button className="backlink" onClick=${onBack}>← All homes</button>
        <div className="detail" style=${{ marginTop: '10px' }}>
          <div>
            <div className="detail-photo"><img src=${p.photo} alt=${p.address} /></div>
            <div className="kicker" style=${{ marginTop: '18px' }}>${p.neighborhood}</div>
            <h1>${p.address}</h1>
            <div style=${{ color: 'var(--ink-mute)', marginTop: '4px' }}>${p.tagline}</div>
            <p className="desc">${p.description}</p>
            <ul className="feature-list">${p.features.map(f => html`<li key=${f}>${f}</li>`)}</ul>
            <table className="spec-table"><tbody>
              ${specs.map(([k, v]) => html`<tr key=${k}><td>${k}</td><td>${v}</td></tr>`)}
            </tbody></table>
          </div>
          <div className="card offer-card">
            <div className="kicker">Asking</div>
            <div className="price" style=${{ fontSize: '34px', marginBottom: '6px' }}>${fmt(p.asking_price)}</div>
            <h3>Make your offer</h3>
            <p style=${{ color: 'var(--ink-mute)', fontSize: '13px', margin: '4px 0 6px' }}>
              Your agent negotiates toward a deal without ever revealing your ceiling.</p>
            <div className="field">
              <label>Your budget ceiling <span className="hint">— the most you'll pay; kept private</span></label>

              <label>Who's driving</label>
              <div className="seg">
                <button className=${cx(control === 'autopilot' && 'on')} onClick=${() => setControl('autopilot')}>Agent, with approvals</button>
                <button className=${cx(control === 'manual' && 'on')} onClick=${() => setControl('manual')}>I'll negotiate</button>
              </div>
              <div className="hint" style=${{ marginTop: '6px' }}>
                ${control === 'autopilot'
                  ? 'Your agent pauses for your nod before closing or when pushed hard.'
                  : 'You type every offer yourself; the contractor’s agent replies.'}
              </div>
            </div>
            ${control === 'autopilot' && html`<div className="field">
              <label>Ask me before offering above <span className="hint">— optional</span></label>
              <input className="input" type="number" placeholder="no cap" value=${cap} onChange=${e => setCap(e.target.value)} />
            </div>`}
            <button className="btn btn-primary btn-block" onClick=${engage}>
              ${control === 'autopilot' ? 'Engage your agent →' : 'Open the negotiation →'}
            </button>
          </div>
        </div>
      </div>`;
    }

    // ==================================================================== Bubble
    function Bubble({ m, currency }) {
      const isHuman = m.source === 'human';
      const who = isHuman ? (m.side === 'buyer' ? 'You' : 'Cornerstone')
        : (m.side === 'buyer' ? WHO.buyer : WHO.seller);
      const backLabel = { openrouter: 'live', ollama: 'local', mock: 'offline' }[m.backend];
      const tactic = (m.detected_tactic && m.detected_tactic !== 'neutral') ? m.detected_tactic : null;
      return html`<div className=${cx('msg', m.side, isHuman && 'human')}>
        <div className="msg-meta">
          <span className="who">${who}</span><span>· round ${m.round}</span>
          ${isHuman && html`<span className="tag-mini tag-you">you</span>`}
          ${m.quoted_price != null && html`<span className="tag-mini tag-offer">${fmt(m.quoted_price, currency)}</span>`}
          ${tactic && html`<span className="tag-mini tag-tactic">${String(tactic).replace(/_/g, ' ')}</span>`}
          ${m.validator_leak_detected && html`<span className="tag-mini tag-leak">leak</span>`}
          ${backLabel && !isHuman && html`<span className="tag-mini tag-src">${backLabel}</span>`}
        </div>
        <div className="bubble">${m.content}</div>
      </div>`;
    }

    // ====================================================================== Room
    function Room({ session, pendingSide, playing, busy, prov, onSend, onApprove,
                    onTakeOver, onHandBack, onTogglePlay, onStep, onViewReport, onNewSearch, onBack }) {
      const [msg, setMsg] = useState('');
      const [counter, setCounter] = useState('');
      const scroller = useRef(null);
      const hist = session.history || [];
      useEffect(() => {
        const el = scroller.current; if (el) el.scrollTop = el.scrollHeight;
      }, [hist.length, pendingSide]);

      const active = session.status === 'active';
      const pa = session.pending_approval;
      const awaitingApproval = !!pa;
      const buyerManual = session.mode.buyer === 'human';
      const cur = session.currency;

      const showComposer = active && !awaitingApproval && buyerManual && session.turn === 'buyer';
      const showWaiting = active && !awaitingApproval && buyerManual && session.turn !== 'buyer';
      const showLive = active && !awaitingApproval && !buyerManual;

      const dom = ledgerDomain(session);
      const bo = session.offers.buyer, so = session.offers.seller;
      const gap = (bo != null && so != null) ? Math.max(0, so - bo) : null;
      const send = () => { if (msg.trim() && !busy) { onSend(msg.trim()); setMsg(''); } };

      return html`<div className="wrap">
        <button className="backlink" onClick=${onBack}>← Back to listing</button>
        <div className="room-head">
          <div>
            <h1>${session.property ? session.property.address : session.title}</h1>
            <div className="meta">${session.property
              ? session.property.neighborhood + ' · asking ' + fmt(session.property.asking_price, cur)
              : 'Private negotiation'}</div>
          </div>
          <div className=${cx('prov', prov.mode === 'ollama' ? 'ollama' : prov.mode === 'live' ? 'live' : 'mock')} title=${prov.reason || ''}>
            <span className=${cx('dot', prov.mode === 'mock' ? 'mock' : 'live')}></span>${prov.label}
          </div>
        </div>

        <div className="room">
          <div className="transcript" ref=${scroller}>
            ${hist.length === 0 && html`<div className="stream-empty">The table is set.<br/>${playing ? 'Your agent is about to open…' : 'Make the first move from the panel on the right.'}</div>`}
            ${hist.map((m, i) => html`<${Bubble} key=${i} m=${m} currency=${cur} />`)}
            ${pendingSide && html`<div className=${cx('msg', pendingSide, 'typing')}>
              <div className="msg-meta"><span className="who">${pendingSide === 'buyer' ? WHO.buyer : WHO.seller}</span><span>is typing</span></div>
              <div className="bubble"><span></span><span></span><span></span></div>
            </div>`}
          </div>

          <div className="rail">
            <div className="panel card">
              <h3>Deal ledger</h3>
              <div className="ledger-nums">
                <div className="ledger-num buyer"><div className="l">Your offer</div><div className="v mono">${fmt(bo, cur)}</div></div>
                <div className="ledger-num seller"><div className="l">Their ask</div><div className="v mono">${fmt(so, cur)}</div></div>
              </div>
              ${dom && html`<div className="track">
                <div className="track-line"></div>
                ${(bo != null && so != null) && html`<div className="track-fill" style=${{ left: posOf(Math.min(bo, so), dom) + '%', right: (100 - posOf(Math.max(bo, so), dom)) + '%' }}></div>`}
                ${bo != null && html`<div className="marker buyer" style=${{ left: posOf(bo, dom) + '%' }}><div className="pin"></div></div>`}
                ${so != null && html`<div className="marker seller" style=${{ left: posOf(so, dom) + '%' }}><div className="pin"></div></div>`}
                ${session.final_price != null && html`<div className="marker settle" style=${{ left: posOf(session.final_price, dom) + '%' }}><div className="pin"></div><div className="cap">deal</div></div>`}
              </div>`}
              <div className="gap-note">${gap != null ? html`Gap to close · <b>${fmt(gap, cur)}</b>` : 'Awaiting the first offers'}</div>
            </div>

            ${active && html`<div className="panel card">
              <h3>At the table</h3>
              <div className="state-line"><span className="k">To move</span><span className="pill-turn">${session.turn === 'buyer' ? WHO.buyer : WHO.seller}</span></div>
              <div className="state-line"><span className="k">Round</span><span className="v">${session.exchange} / ${session.max_rounds}</span></div>
              <div className="state-line"><span className="k">Your side</span><span className="v">${buyerManual ? 'You (hands-on)' : 'Agent'}</span></div>
              ${session.budget_cap != null && html`<div className="state-line"><span className="k">Ask above</span><span className="v mono">${fmt(session.budget_cap, cur)}</span></div>`}
            </div>`}

            ${!active && html`<div className=${cx('banner', session.status)}>
              <h3>${OUTCOME[session.status] || session.status}</h3>
              ${session.final_price != null && html`<div className="big mono">${fmt(session.final_price, cur)}</div>`}
              <div className="stack" style=${{ marginTop: '14px' }}>
                <button className="btn btn-primary btn-block" onClick=${onViewReport}>See the deal report →</button>
                <button className="btn btn-ghost btn-block" onClick=${onNewSearch}>Browse more homes</button>
              </div>
            </div>`}

            ${active && awaitingApproval && html`<div className="panel card approval">
              <h3>Your call</h3>
              <p style=${{ fontSize: '14px', marginBottom: '4px' }}>Your agent wants to offer <b className="mono">${pa.proposed_offer_display || fmt(pa.proposed_offer, cur)}</b>.</p>
              ${pa.seller_last_message && html`<p style=${{ fontSize: '12.5px', color: 'var(--ink-mute)', margin: '4px 0 10px', fontStyle: 'italic' }}>Cornerstone: “${pa.seller_last_message}”</p>`}
              ${(pa.gates || []).map((g, i) => html`<div key=${i} className="gate"><b>${String(g.type).replace(/_/g, ' ')}</b> — ${g.detail}</div>`)}
              <div className="stack" style=${{ marginTop: '10px' }}>
                <button className="btn btn-primary btn-block" disabled=${busy} onClick=${() => onApprove('approve')}>Approve &amp; send</button>
                <textarea className="textarea" placeholder="…or type your own counter" value=${counter} onChange=${e => setCounter(e.target.value)}></textarea>
                <button className="btn btn-ink btn-block" disabled=${busy || !counter.trim()} onClick=${() => { onApprove('counter', counter.trim()); setCounter(''); }}>Send my counter</button>
                <button className="btn btn-danger btn-block" disabled=${busy} onClick=${() => onApprove('walk')}>Walk away</button>
              </div>
            </div>`}

            ${showComposer && html`<div className="panel card">
              <h3>Your move</h3>
              <p style=${{ fontSize: '12.5px', color: 'var(--ink-mute)', marginTop: '-8px', marginBottom: '10px' }}>Name a number to put it on the table.</p>
              <textarea className="textarea" placeholder="e.g. I can do $845,000 if you cover closing." value=${msg} onChange=${e => setMsg(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) send(); }}></textarea>
              <div className="stack" style=${{ marginTop: '9px' }}>
                <button className="btn btn-primary btn-block" disabled=${busy || !msg.trim()} onClick=${send}>${busy ? 'Sending…' : 'Send  ⌘↵'}</button>
                <button className="btn btn-ghost btn-block" disabled=${busy} onClick=${onHandBack}>Hand back to your agent</button>
              </div>
            </div>`}

            ${showWaiting && html`<div className="panel card">
              <h3>Contractor is up</h3>
              <div className="stack">
                <button className="btn btn-ink btn-block" disabled=${busy} onClick=${onStep}>Get the contractor's reply</button>
                <button className="btn btn-ghost btn-block" disabled=${busy} onClick=${onHandBack}>Hand back to your agent</button>
              </div>
            </div>`}

            ${showLive && html`<div className="panel card">
              <h3>Live negotiation</h3>
              <div className="stack">
                <button className="btn btn-ink btn-block" disabled=${busy} onClick=${onTogglePlay}>${playing ? '❚❚  Pause' : '▶  Resume'}</button>
                ${!playing && html`<button className="btn btn-ghost btn-block" disabled=${busy} onClick=${onStep}>Advance one turn</button>`}
                <button className="btn btn-ghost btn-block" disabled=${busy} onClick=${onTakeOver}>Take over as buyer</button>
              </div>
            </div>`}
          </div>
        </div>
      </div>`;
    }

    // ==================================================================== Report
    function Report({ report, onBack, onNewSearch }) {
      const d = report.deal_analysis || {};
      const cur = report.currency || '$';
      const agreed = report.status === 'agreed';
      const vals = [d.zopa_low, d.zopa_high, report.final_price, d.fair_midpoint].filter(v => v != null);
      let lo = vals.length ? Math.min(...vals) : 0, hi = vals.length ? Math.max(...vals) : 1;
      if (!(hi > lo)) hi = lo + 1;
      const pad = (hi - lo) * 0.12 || 1; lo -= pad; hi += pad;
      const P = v => Math.max(0, Math.min(100, ((v - lo) / (hi - lo)) * 100));
      const bpct = d.buyer_capture_pct || 0, spct = d.seller_capture_pct || 0;
      const backs = report.narration_backends || {};
      const liveN = backs.openrouter || 0;
      const totalN = Object.values(backs).reduce((a, b) => a + b, 0);
      const tac = report.tactics_used || { buyer: {}, seller: {} };
      const flags = report.confidence_flags || {};
      const nLeak = (flags.leak_failures || []).length;
      const nPrice = (flags.price_failures || []).length;
      const chatSrc = !totalN ? '—'
        : liveN === totalN ? 'Live API (100%)'
        : liveN ? Math.round(100 * liveN / totalN) + '% live · rest fallback'
        : 'Offline narrator';
      const stats = [
        ['Final price', fmt(report.final_price, cur)],
        ['Rounds', report.rounds_completed],
        ['ZOPA width', d.zopa_exists ? fmt(d.zopa_size, cur) : 'none'],
        ['Fair midpoint', fmt(d.fair_midpoint, cur)],
      ];

      return html`<div className="wrap">
        <button className="backlink" onClick=${onBack}>← Back to the room</button>
        <div className=${cx('banner', report.status)} style=${{ marginTop: '10px' }}>
          <h3>${report.outcome}</h3>
          ${report.final_price != null && html`<div className="big mono">${fmt(report.final_price, cur)}</div>`}
          <div style=${{ fontSize: '13.5px', color: 'var(--ink-soft)', marginTop: '6px' }}>${d.notes}</div>
        </div>

        <div className="report-grid">
          ${stats.map(([l, v]) => html`<div key=${l} className="card stat"><div className="l">${l}</div><div className="v mono">${v}</div></div>`)}
        </div>

        ${d.zopa_exists && html`<div className="card panel" style=${{ marginTop: '20px' }}>
          <h3>Zone of possible agreement</h3>
          <div className="zopa">
            <div className="zopa-band" style=${{ left: P(d.zopa_low) + '%', width: (P(d.zopa_high) - P(d.zopa_low)) + '%' }}></div>
            <div className="zopa-lab" style=${{ left: P(d.zopa_low) + '%' }}>${fmt(d.zopa_low, cur)} · floor</div>
            <div className="zopa-lab" style=${{ left: P(d.zopa_high) + '%' }}>${fmt(d.zopa_high, cur)} · ceiling</div>
            ${report.final_price != null && html`<div className="zopa-settle" style=${{ left: P(report.final_price) + '%' }}></div>`}
          </div>
          ${agreed && html`<div>
            <div style=${{ fontSize: '12.5px', color: 'var(--ink-mute)', margin: '18px 0 2px' }}>How the surplus split</div>
            <div className="split-bar">
              <div className="split-seg split-buyer" style=${{ width: Math.max(0, bpct) + '%' }}>${bpct >= 14 ? 'You ' + bpct + '%' : ''}</div>
              <div className="split-seg split-seller" style=${{ width: Math.max(0, spct) + '%' }}>${spct >= 14 ? 'Seller ' + spct + '%' : ''}</div>
            </div>
            <div className="ledger-nums" style=${{ marginTop: '12px' }}>
              <div className="ledger-num buyer"><div className="l">You saved vs. ceiling</div><div className="v mono" style=${{ fontSize: '18px' }}>${fmt(d.buyer_surplus, cur)}</div></div>
              <div className="ledger-num seller"><div className="l">Room you left</div><div className="v mono" style=${{ fontSize: '18px' }}>${fmt(report.money_left_on_table.buyer, cur)}</div></div>
            </div>
          </div>`}
        </div>`}

        <div className="report-grid">
          <div className="card panel">
            <h3>Tactics at the table</h3>
            <div className="tactic-cols">
              <div>
                <div className="who" style=${{ color: 'var(--pine)', marginBottom: '8px' }}>Your agent</div>
                ${Object.keys(tac.buyer || {}).length
                  ? Object.entries(tac.buyer).map(([k, v]) => html`<div key=${k} className="gate" style=${{ background: 'var(--pine-tint)' }}>${k.replace(/_/g, ' ')} · ${v}</div>`)
                  : html`<div style=${{ color: 'var(--ink-mute)', fontSize: '13px' }}>none detected</div>`}
              </div>
              <div>
                <div className="who" style=${{ color: 'var(--clay)', marginBottom: '8px' }}>Cornerstone</div>
                ${Object.keys(tac.seller || {}).length
                  ? Object.entries(tac.seller).map(([k, v]) => html`<div key=${k} className="gate" style=${{ background: 'var(--clay-tint)' }}>${k.replace(/_/g, ' ')} · ${v}</div>`)
                  : html`<div style=${{ color: 'var(--ink-mute)', fontSize: '13px' }}>none detected</div>`}
              </div>
            </div>
          </div>

          <div className="card panel">
            <h3>Integrity &amp; provenance</h3>
            <div className="state-line"><span className="k">Reservation-price leaks</span><span className=${nLeak ? 'integrity-bad' : 'integrity-ok'}>${nLeak ? nLeak + ' ⚠' : 'none ✓'}</span></div>
            <div className="state-line"><span className="k">Engine-price mismatches</span><span className=${nPrice ? 'integrity-bad' : 'integrity-ok'}>${nPrice ? nPrice + ' ⚠' : 'none ✓'}</span></div>
            <div className="state-line"><span className="k">Chat source</span><span className="v">${chatSrc}</span></div>
            <div className="state-line"><span className="k">Interventions</span><span className="v">${(report.interventions || []).length}</span></div>
            <div style=${{ marginTop: '12px', fontSize: '13px', fontWeight: 600, color: report.clean ? 'var(--good)' : 'var(--bad)' }}>
              ${report.clean ? '✓ Clean run — no leaks, every price consistent with the engine.' : '⚠ Review the flags above.'}
            </div>
          </div>
        </div>

        <div className="stack" style=${{ marginTop: '22px', maxWidth: '320px' }}>
          <button className="btn btn-primary btn-block" onClick=${onNewSearch}>Browse more homes</button>
        </div>
      </div>`;
    }

    // ======================================================================= App
    function App() {
      const [view, setView] = useState('gallery');
      const [properties, setProperties] = useState([]);
      const [loadErr, setLoadErr] = useState(null);
      const [selected, setSelected] = useState(null);
      const [session, setSession] = useState(null);
      const [report, setReport] = useState(null);
      const [busy, setBusy] = useState(false);
      const [pendingSide, setPendingSide] = useState(null);
      const [playing, setPlaying] = useState(false);
      const [error, setError] = useState(null);
      const [llm, setLlm] = useState(null);
      const [probing, setProbing] = useState(false);

      useEffect(() => {
        api('/properties').then(d => setProperties(d.properties || [])).catch(e => setLoadErr(e.message));
        api('/health/llm').then(setLlm).catch(() => {});
      }, []);

      const jpost = (path, obj) => api(path, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(obj || {}),
      });
      const takeSession = (data) => setSession(data.session || data);

      const probeLLM = async () => {
        setProbing(true);
        try { setLlm(await api('/health/llm?probe=1')); }
        catch (e) { setError(e.message); }
        finally { setProbing(false); }
      };

      const openDetail = (p) => { setSelected(p); setError(null); setView('detail'); };
      const goGallery = () => {
        setView('gallery'); setSession(null); setReport(null);
        setPlaying(false); setPendingSide(null); setError(null);
      };

      const engage = async ({ reservation, control, budgetCap }) => {
        setError(null);
        try {
          const body = { property_id: selected.id, buyer: { reservation_price: reservation }, buyer_control: control };
          if (budgetCap != null) body.budget_cap = budgetCap;
          takeSession(await jpost('/session', body));
          setReport(null);
          setPlaying(control === 'autopilot');
          setView('room');
        } catch (e) { setError(e.message); }
      };

      const step = async () => {
        if (!session || busy) return;
        setBusy(true); setPendingSide(session.turn);
        try { takeSession(await jpost(`/session/${session.id}/message`, {})); }
        catch (e) { setError(e.message); setPlaying(false); }
        finally { setBusy(false); setPendingSide(null); }
      };

      const sendHuman = async (text) => {
        if (!session || busy) return;
        setBusy(true); setPendingSide('seller');
        try { takeSession(await jpost(`/session/${session.id}/message`, { message: text })); }
        catch (e) { setError(e.message); }
        finally { setBusy(false); setPendingSide(null); }
      };

      const resolveApproval = async (decision, message) => {
        if (!session || busy) return;
        setBusy(true);
        if (decision !== 'walk') setPendingSide('seller');
        try {
          const data = await jpost(`/session/${session.id}/approve`, message ? { decision, message } : { decision });
          const s = data.session || data;
          setSession(s);
          if (s.status === 'active' && !s.pending_approval && s.mode[s.turn] === 'auto' && s.mode.buyer === 'auto') setPlaying(true);
        } catch (e) { setError(e.message); }
        finally { setBusy(false); setPendingSide(null); }
      };

      const takeOver = async () => {
        if (!session) return;
        setPlaying(false);
        try { takeSession(await jpost(`/session/${session.id}/intervene`, { side: 'buyer', action: 'take_over' })); }
        catch (e) { setError(e.message); }
      };

      const handBack = async () => {
        if (!session) return;
        try {
          const data = await jpost(`/session/${session.id}/intervene`, { side: 'buyer', action: 'return_to_ai' });
          setSession(data.session || data);
          setPlaying(true);
        } catch (e) { setError(e.message); }
      };

      const viewReport = async () => {
        if (!session) return;
        try { setReport(await api(`/session/${session.id}/report`)); setView('report'); }
        catch (e) { setError(e.message); }
      };

      // auto-play: advance one AUTO turn at a time with a beat, for live reveal
      useEffect(() => {
        if (view !== 'room' || !session || !playing || busy) return;
        if (session.status !== 'active' || session.pending_approval) return;
        if (session.mode[session.turn] !== 'auto') return;
        const t = setTimeout(step, 820);
        return () => clearTimeout(t);
      }, [view, session, playing, busy]);

      const prov = session ? provenance(session) : { mode: 'mock', label: '' };

      return html`<div>
        <div className="topbar"><div className="topbar-in">
          <button className="brand" onClick=${goGallery}>
            <span className="brand-mark"><${HouseMark} /></span>
            <span><span className="brand-name">Cornerstone Homes</span><span className="brand-sub">Marlowe Ridge</span></span>
          </button>
          <span className="topbar-spacer"></span>
          <${StatusPill} llm=${llm} probing=${probing} onProbe=${probeLLM} />
        </div></div>

        ${error && html`<div className="wrap" style=${{ paddingBottom: 0 }}><div className="alert alert-error">${error}</div></div>`}

        ${view === 'gallery' && (loadErr
          ? html`<div className="wrap"><div className="alert alert-error">Couldn't load listings: ${loadErr}. Is the server running?</div></div>`
          : html`<${Gallery} properties=${properties} onOpen=${openDetail} />`)}
        ${view === 'detail' && selected && html`<${Detail} property=${selected} onBack=${goGallery} onEngage=${engage} />`}
        ${view === 'room' && session && html`<${Room} session=${session} pendingSide=${pendingSide} playing=${playing} busy=${busy} prov=${prov}
            onSend=${sendHuman} onApprove=${resolveApproval} onTakeOver=${takeOver} onHandBack=${handBack}
            onTogglePlay=${() => setPlaying(p => !p)} onStep=${step} onViewReport=${viewReport}
            onNewSearch=${goGallery} onBack=${() => setView('detail')} />`}
        ${view === 'report' && report && html`<${Report} report=${report} onBack=${() => setView('room')} onNewSearch=${goGallery} />`}
      </div>`;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
