<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cornerstone Homes</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --nav-bg: #1B2735;
    --main-bg: #F4EFE6;
    --accent: #926C3B;
    --text: #1B2735;
    --card-bg: #FFFFFF;
    --muted: #6B7280;
    --btn-primary: #926C3B;
    --btn-secondary: #E5E7EB;
  }
  body {
    margin: 0;
    font-family: 'DM Sans', sans-serif;
    background-color: var(--main-bg);
    color: var(--text);
  }
  * { box-sizing: border-box; }
  
  .navbar {
    background: var(--nav-bg);
    color: white;
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .navbar-brand {
    font-weight: 700;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .navbar-brand span { font-weight: 400; font-size: 0.8rem; letter-spacing: 1px; color: #9CA3AF; text-transform: uppercase; }
  .badge-api {
    background: rgba(255,255,255,0.1);
    padding: 0.4rem 0.8rem;
    border-radius: 20px;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .badge-api::before { content:''; width:8px; height:8px; background:#10B981; border-radius:50%; }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 3rem 2rem;
  }
  
  .hero-subtitle {
    text-transform: uppercase;
    font-size: 0.8rem;
    letter-spacing: 1px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 1rem;
  }
  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: 3.5rem;
    line-height: 1.1;
    margin: 0 0 1.5rem 0;
    color: var(--nav-bg);
  }
  .hero-title span { color: var(--accent); }
  
  .top-section {
    display: flex;
    justify-content: space-between;
    margin-bottom: 3rem;
  }
  .top-desc {
    max-width: 400px;
    color: var(--muted);
    font-size: 1.1rem;
    line-height: 1.5;
  }
  .stats-box {
    background: var(--nav-bg);
    color: white;
    padding: 1.5rem 2rem;
    border-radius: 12px;
    display: flex;
    gap: 3rem;
  }
  .stat-item { display: flex; flex-direction: column; gap: 0.2rem; }
  .stat-val { font-size: 1.5rem; font-weight: 700; }
  .stat-lbl { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: #9CA3AF; }

  .section-lbl {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .section-lbl::after { content: ""; flex: 1; height: 1px; background: rgba(0,0,0,0.1); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.5rem;
  }
  .card {
    background: var(--card-bg);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    cursor: pointer;
    transition: transform 0.2s;
  }
  .card:hover { transform: translateY(-3px); }
  
  .card-img {
    height: 180px;
    position: relative;
    padding: 1rem;
  }
  .badge-days {
    position: absolute;
    top: 1rem; left: 1rem;
    background: var(--nav-bg);
    color: white;
    font-size: 0.7rem;
    padding: 0.3rem 0.6rem;
    border-radius: 4px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .card-body { padding: 1.5rem; }
  .card-title { font-size: 1.2rem; font-weight: 700; margin: 0 0 0.2rem 0; }
  .card-sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 1rem; }
  .card-feats { display: flex; gap: 0.8rem; font-size: 0.8rem; color: var(--muted); margin-bottom: 1.5rem; }
  .card-feats span { background: #F3F4F6; padding: 0.2rem 0.6rem; border-radius: 4px; }
  .card-footer { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid #F3F4F6; padding-top: 1rem; }
  .card-price { font-size: 1.4rem; font-weight: 700; }
  .card-psf { font-size: 0.8rem; color: #9CA3AF; }

  .back-btn { font-size: 0.9rem; color: var(--muted); cursor: pointer; display: inline-block; margin-bottom: 1rem; }
  .back-btn:hover { color: var(--text); }
  
  .detail-layout {
    display: flex;
    gap: 3rem;
  }
  .detail-main { flex: 1.5; }
  .detail-side { flex: 1; }
  
  .large-img {
    height: 400px;
    border-radius: 16px;
    position: relative;
    margin-bottom: 2rem;
  }
  
  .offer-box {
    background: var(--card-bg);
    padding: 2rem;
    border-radius: 16px;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
  }
  .offer-box h3 { margin: 0 0 0.5rem 0; font-size: 1.2rem; }
  .offer-box p { font-size: 0.9rem; color: var(--muted); margin-bottom: 1.5rem; }
  
  label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.5rem; }
  input[type="number"], input[type="text"] {
    width: 100%; padding: 0.8rem; border: 1px solid #D1D5DB; border-radius: 8px; font-size: 1rem;
    margin-bottom: 1.5rem; background: #F9FAFB;
  }
  
  .btn {
    width: 100%;
    padding: 1rem;
    border-radius: 8px;
    border: none;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-primary { background: var(--btn-primary); color: white; }
  .btn-primary:hover { background: #7c5a31; }
  
  .toggle-group { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
  .toggle-btn {
    flex: 1; padding: 0.8rem; border: 1px solid #D1D5DB; background: white;
    border-radius: 8px; cursor: pointer; font-size: 0.9rem; color: var(--muted);
  }
  .toggle-btn.active { background: #ECFDF5; border-color: #10B981; color: #047857; font-weight: 700; }
  
  .neg-layout {
    display: flex; gap: 2rem; height: calc(100vh - 160px);
  }
  .neg-main {
    flex: 2; background: var(--card-bg); border-radius: 12px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .neg-side {
    flex: 1; display: flex; flex-direction: column; gap: 1.5rem; overflow-y: auto;
  }
  .chat-header {
    padding: 1rem 1.5rem; border-bottom: 1px solid #F3F4F6;
    display: flex; justify-content: space-between; align-items: center;
  }
  .chat-body {
    flex: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; background: #F9FAFB;
  }
  
  .bubble-wrap { display: flex; flex-direction: column; max-width: 80%; }
  .bubble-wrap.buyer { align-self: flex-start; }
  .bubble-wrap.seller { align-self: flex-end; align-items: flex-end; }
  
  .bubble-meta { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: #9CA3AF; margin-bottom: 0.4rem; display: flex; gap: 0.5rem; align-items: center; }
  .bubble-tag { padding: 0.2rem 0.4rem; border-radius: 4px; font-size: 0.65rem; }
  .tag-concession { background: #E0E7FF; color: #4338CA; }
  .tag-leak { background: #FEE2E2; color: #B91C1C; }
  .tag-offline { background: #F3F4F6; color: #4B5563; }
  .tag-live { background: #ECFDF5; color: #047857; }
  
  .bubble { padding: 1rem 1.2rem; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; }
  .buyer .bubble { background: #E0F2FE; color: #0369A1; border-bottom-left-radius: 2px; }
  .seller .bubble { background: #FFFFFF; border: 1px solid #E5E7EB; color: #111827; border-bottom-right-radius: 2px; }
  
  .widget { background: var(--card-bg); padding: 1.5rem; border-radius: 12px; }
  .widget h4 { margin: 0 0 1rem 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  
  .slider-rail { height: 4px; background: #E5E7EB; position: relative; margin: 2rem 0 1rem 0; border-radius: 2px; }
  .slider-dot { width: 14px; height: 14px; border-radius: 50%; position: absolute; top: -5px; transform: translateX(-5px); }
  .slider-dot.buyer { background: #10B981; }
  .slider-dot.seller { background: #F59E0B; }
  
  .report-card { background: var(--card-bg); padding: 2rem; border-radius: 12px; }
  .report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 2rem; }
  .r-box { background: #F9FAFB; padding: 1.5rem; border-radius: 8px; }
  .r-box h5 { margin: 0 0 1rem 0; font-size: 0.75rem; text-transform: uppercase; color: var(--muted); }
  
</style>
<script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "htm": "https://esm.sh/htm@3.1.1"
    }
  }
</script>
</head>
<body>
<div id="root"></div>
<script type="module">
  import React, { useState, useEffect, useRef } from 'react';
  import { createRoot } from 'react-dom/client';
  import htm from 'htm';

  const html = htm.bind(React.createElement);

  const HOMES = [
    { id: '1', title: '42 Maple Court', desc: 'Modern Farmhouse · Marlowe Ridge', beds: 4, baths: 3, sqft: 2450, price: 625000, days: 21, color: '#F4E6D2' },
    { id: '2', title: '18 Birchwood Lane', desc: 'Craftsman Bungalow · Old Marlowe', beds: 3, baths: 2, sqft: 1780, price: 438000, days: 44, color: '#D0E3C7' },
    { id: '3', title: '7 Harbor View Terrace', desc: 'Waterfront Contemporary · The Point', beds: 5, baths: 4, sqft: 3620, price: 915000, days: 12, color: '#D0E8ED' }
  ];

  function HouseIllustration({ color }) {
    return html`
      <svg width="100%" height="100%" viewBox="0 0 300 180" style="${{background: color}}">
        <circle cx="230" cy="50" r="15" fill="#FCECA7" opacity="0.8" />
        <rect x="0" y="140" width="300" height="40" fill="#BDB495" />
        <circle cx="60" cy="115" r="20" fill="#ECA26F" />
        <rect x="55" y="130" width="10" height="20" fill="#6B4E38" />
        <polygon points="150,80 90,120 210,120" fill="#8B604F" />
        <rect x="100" y="120" width="100" height="30" fill="#FFFFFF" />
        <rect x="140" y="125" width="20" height="25" fill="#3D5A64" />
        <rect x="110" y="125" width="15" height="15" fill="#A8D6E1" />
        <rect x="175" y="125" width="15" height="15" fill="#A8D6E1" />
      </svg>
    `;
  }
  function HouseIllustration2({ color }) {
    return html`
      <svg width="100%" height="100%" viewBox="0 0 300 180" style="${{background: color}}">
        <circle cx="230" cy="50" r="15" fill="#FCECA7" opacity="0.8" />
        <rect x="0" y="140" width="300" height="40" fill="#99AA8A" />
        <circle cx="80" cy="110" r="18" fill="#88B087" />
        <rect x="75" y="125" width="10" height="20" fill="#5C4533" />
        <polygon points="150,90 100,120 200,120" fill="#5F8161" />
        <rect x="110" y="120" width="80" height="30" fill="#FFFFFF" />
        <rect x="143" y="125" width="14" height="25" fill="#755038" />
        <rect x="120" y="125" width="12" height="12" fill="#B0D5D4" />
        <rect x="168" y="125" width="12" height="12" fill="#B0D5D4" />
      </svg>
    `;
  }
  function HouseIllustration3({ color }) {
    return html`
      <svg width="100%" height="100%" viewBox="0 0 300 180" style="${{background: color}}">
        <circle cx="250" cy="40" r="15" fill="#FCECA7" opacity="0.8" />
        <rect x="0" y="140" width="300" height="40" fill="#AA9B82" />
        <circle cx="50" cy="115" r="18" fill="#8BB5C9" />
        <rect x="45" y="130" width="10" height="20" fill="#58595B" />
        <polygon points="150,85 90,120 210,120" fill="#4B667C" />
        <rect x="100" y="120" width="100" height="30" fill="#FFFFFF" />
        <rect x="140" y="125" width="20" height="25" fill="#C46D4B" />
        <rect x="110" y="125" width="18" height="15" fill="#C9E4E7" />
        <rect x="172" y="125" width="18" height="15" fill="#C9E4E7" />
      </svg>
    `;
  }

  const illust = [HouseIllustration, HouseIllustration2, HouseIllustration3];

  function formatMoney(n) {
    return "$" + n.toLocaleString();
  }

  function App() {
    const [view, setView] = useState('list');
    const [home, setHome] = useState(null);
    const [budget, setBudget] = useState('');
    const [session, setSession] = useState(null);
    const [loading, setLoading] = useState(false);
    const [humanMsg, setHumanMsg] = useState('');
    const [report, setReport] = useState(null);
    
    const chatEndRef = useRef(null);

    useEffect(() => {
      if (chatEndRef.current) {
        chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
      }
    }, [session?.history]);

    const startNegotiation = async () => {
      setLoading(true);
      const bRes = parseInt(budget);
      const sRes = Math.floor(home.price * 0.90);
      const bOpen = Math.floor(bRes * 0.60);
      
      try {
        const res = await fetch('/session', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            buyer: { reservation_price: bRes, opening_offer: bOpen },
            seller: { reservation_price: sRes, opening_offer: home.price },
            title: home.title,
            currency: '$',
            buyer_control: 'autopilot'
          })
        });
        const data = await res.json();
        setSession(data);
        setView('neg');
      } catch (err) { alert(err); }
      setLoading(false);
    };

    const advance = async () => {
      setLoading(true);
      try {
        const res = await fetch(`/session/${session.id}/message`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({})
        });
        const data = await res.json();
        setSession(data.session);
        if(data.session.status !== 'active') fetchReport(data.session.id);
      } catch(err) {}
      setLoading(false);
    };

    const sendMsg = async () => {
      if (!humanMsg.trim()) return;
      setLoading(true);
      try {
        const res = await fetch(`/session/${session.id}/message`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({message: humanMsg})
        });
        const data = await res.json();
        setSession(data.session);
        setHumanMsg('');
        if(data.session.status !== 'active') fetchReport(data.session.id);
      } catch(err) {}
      setLoading(false);
    };

    const intervene = async (action) => {
      setLoading(true);
      try {
        const res = await fetch(`/session/${session.id}/intervene`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({side: session.turn, action})
        });
        const data = await res.json();
        setSession(data.session);
      } catch(err){}
      setLoading(false);
    };

    const fetchReport = async (sid) => {
      const res = await fetch(`/session/${sid}/report`);
      const data = await res.json();
      setReport(data);
    };

    if (view === 'list') {
      return html`
        <div>
          <div className="navbar">
            <div className="navbar-brand">🏠 Cornerstone Homes <span>Marlowe Ridge</span></div>
            <div className="badge-api">Live API ready</div>
          </div>
          <div className="container">
            <div className="hero-subtitle">Cornerstone Homes · Marlowe Ridge</div>
            <h1 className="hero-title">Homes built to last.<br/><span>Deals done in the open.</span></h1>
            <div className="top-section">
              <div className="top-desc">Browse our new-build collection, then send your own negotiating agent to the table. Every counter is on the record — and you can step in whenever you like.</div>
              <div className="stats-box">
                <div className="stat-item"><span className="stat-val">7</span><span className="stat-lbl">Homes Listed</span></div>
                <div className="stat-item"><span className="stat-val">$687,000</span><span className="stat-lbl">Avg. Asking</span></div>
                <div className="stat-item"><span className="stat-val">2</span><span className="stat-lbl">Agents at table</span></div>
              </div>
            </div>
            
            <div className="section-lbl">Available Now</div>
            <div className="grid">
              ${HOMES.map((h, i) => {
                const Illus = illust[i];
                return html`
                  <div key="${h.id}" className="card" onClick="${() => { setHome(h); setBudget(h.price.toString()); setView('detail'); }}">
                    <div className="card-img">
                      <div className="badge-days">${h.days} DAYS ON MARKET</div>
                      <${Illus} color="${h.color}" />
                    </div>
                    <div className="card-body">
                      <h3 className="card-title">${h.title}</h3>
                      <div className="card-sub">${h.desc}</div>
                      <div className="card-feats">
                        <span>${h.beds} bd</span>
                        <span>${h.baths} ba</span>
                        <span>${h.sqft.toLocaleString()} sqft</span>
                      </div>
                      <div className="card-footer">
                        <div className="card-price">${formatMoney(h.price)}</div>
                        <div className="card-psf">$${Math.floor(h.price/h.sqft)}/sqft</div>
                      </div>
                    </div>
                  </div>
                `;
              })}
            </div>
          </div>
        </div>
      `;
    }

    if (view === 'detail') {
      const Illus = illust[parseInt(home.id)-1];
      return html`
        <div>
          <div className="navbar">
            <div className="navbar-brand">🏠 Cornerstone Homes <span>Marlowe Ridge</span></div>
            <div className="badge-api">Live API ready</div>
          </div>
          <div className="container">
            <div className="back-btn" onClick="${()=>setView('list')}">← All homes</div>
            <div className="detail-layout">
              <div className="detail-main">
                <div className="large-img">
                  <${Illus} color="${home.color}" />
                </div>
                <div style="${{textTransform:'uppercase', fontSize:'0.8rem', letterSpacing:'1px', color:'#9CA3AF', marginBottom:'0.5rem'}}">Old Marlowe</div>
                <h1 style="${{margin:'0 0 1rem 0'}}">${home.title}</h1>
                <p style="${{color:'#6B7280', fontSize:'1.1rem'}}">${home.desc}</p>
                <p style="${{lineHeight:'1.6', marginTop:'1.5rem', color:'#374151'}}">A warm craftsman bungalow with tapered columns, a deep front porch, and site-finished oak floors. Updated bath, gas range, and a detached studio at the back of the lot.</p>
              </div>
              <div className="detail-side">
                <div className="offer-box">
                  <div style="${{fontSize:'0.8rem', fontWeight:'700', color:'#9CA3AF', letterSpacing:'1px', marginBottom:'0.5rem'}}">Asking</div>
                  <div style="${{fontSize:'2.5rem', fontWeight:'700', color:'#1B2735', marginBottom:'1.5rem'}}">${formatMoney(home.price)}</div>
                  
                  <h3>Make your offer</h3>
                  <p>Your agent negotiates toward a deal without ever revealing your ceiling.</p>
                  
                  <label>Your budget ceiling — the most you'll pay; kept private</label>
                  <input type="number" value="${budget}" onChange="${e=>setBudget(e.target.value)}" />
                  
                  <label>Who's driving</label>
                  <div className="toggle-group">
                    <button className="toggle-btn active">Agent, with approvals</button>
                    <button className="toggle-btn">I'll negotiate</button>
                  </div>
                  <p style="${{fontSize:'0.8rem', marginTop:'-0.5rem'}}">Your agent pauses for your nod before closing or when pushed hard.</p>
                  
                  <label style="${{marginTop:'1.5rem'}}">Ask me before offering above — optional</label>
                  <input type="text" placeholder="no cap" />
                  
                  <button className="btn btn-primary" onClick="${startNegotiation}" disabled="${loading}">
                    ${loading ? 'Starting...' : 'Engage your agent →'}
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    if (view === 'neg' && session) {
      const bOffer = session.offers.buyer || (session.history.length === 0 ? Math.floor(parseInt(budget)*0.6) : null);
      const sOffer = session.offers.seller || home.price;
      const bStart = Math.floor(parseInt(budget)*0.6);
      const sStart = home.price;
      
      const range = sStart - bStart;
      const bPct = bOffer ? ((bOffer - bStart)/range)*100 : 0;
      const sPct = sOffer ? ((sOffer - bStart)/range)*100 : 100;
      
      const isEnded = session.status !== 'active';

      return html`
        <div>
          <div className="navbar">
            <div className="navbar-brand">🏠 Cornerstone Homes <span>Marlowe Ridge</span></div>
            <div className="badge-api">${session.live_llm ? 'Live OpenRouter' : 'Offline Narrator'}</div>
          </div>
          
          <div className="container" style="${{paddingTop:'2rem'}}">
            <div className="back-btn" onClick="${()=>setView('list')}">← Back to listing</div>
            <h2 style="${{margin:'0 0 0.5rem 0'}}">${home.title}</h2>
            <div style="${{color:'#6B7280', fontSize:'0.9rem', marginBottom:'2rem'}}">Old Marlowe · asking ${formatMoney(home.price)}</div>
            
            ${isEnded && report ? html`
              <div className="report-card" style="${{marginBottom:'2rem', background: report.status === 'agreed' ? '#ECFDF5' : '#FEE2E2'}}">
                <h3 style="${{margin:0}}">
                  ${report.status === 'agreed' ? 'Deal Reached' : 'Walked away — no deal'}
                </h3>
                <p style="${{marginTop:'0.5rem', color:'#4B5563'}}">
                  ${report.status === 'agreed' ? 'Agreement was found within the ZOPA.' : 'No deal was possible or maximum rounds reached.'}
                </p>
                
                <div className="report-grid">
                  <div className="r-box"><h5>Final Price</h5><div style="${{fontSize:'1.8rem', fontWeight:700}}">${report.final_price ? formatMoney(report.final_price) : '—'}</div></div>
                  <div className="r-box"><h5>Rounds</h5><div style="${{fontSize:'1.8rem', fontWeight:700}}">${report.total_rounds}</div></div>
                  <div className="r-box"><h5>ZOPA Width</h5><div style="${{fontSize:'1.8rem', fontWeight:700}}">${report.zopa_size ? formatMoney(report.zopa_size) : 'none'}</div></div>
                  <div className="r-box"><h5>Integrity & Provenance</h5>
                    <ul style="${{margin:0, paddingLeft:'1.2rem', color:'#4B5563', fontSize:'0.9rem'}}">
                      <li>Leaks: ${report.leaks_detected}</li>
                      <li>Inconsistencies: ${report.price_inconsistencies}</li>
                      <li>Clean run: ${report.clean ? 'Yes' : 'No'}</li>
                    </ul>
                  </div>
                </div>
              </div>
            ` : null}

            <div className="neg-layout">
              <div className="neg-main">
                <div className="chat-body">
                  ${session.history.map((m, i) => html`
                    <div key="${i}" className="${`bubble-wrap ${m.side}`}">
                      <div className="bubble-meta">
                        ${m.side === 'buyer' ? 'YOUR AGENT' : 'CORNERSTONE'} · round ${m.round}
                        ${m.quoted_price && html`<span style="${{color: m.side==='buyer'?'#0369A1':'#B45309'}}">${formatMoney(m.quoted_price)}</span>`}
                        ${m.detected_tactic && m.detected_tactic !== 'neutral' && html`<span className="bubble-tag tag-concession">${m.detected_tactic}</span>`}
                        ${m.validator_leak_detected && html`<span className="bubble-tag tag-leak">LEAK</span>`}
                        <span className="${`bubble-tag ${m.backend === 'mock' || m.backend === 'offline' ? 'tag-offline' : 'tag-live'}`}">
                           ${m.backend === 'mock' ? 'OFFLINE' : 'LIVE'}
                        </span>
                      </div>
                      <div className="bubble">${m.content}</div>
                    </div>
                  `)}
                  <div ref="${chatEndRef}"></div>
                </div>
              </div>
              
              <div className="neg-side">
                <div className="widget">
                  <h4>Deal Ledger</h4>
                  <div style="${{display:'flex', justifyContent:'space-between', marginBottom:'1rem'}}">
                    <div>
                      <div style="${{fontSize:'0.7rem', color:'#10B981', fontWeight:700}}">YOUR OFFER</div>
                      <div style="${{fontSize:'1.3rem', fontWeight:700}}">${bOffer ? formatMoney(bOffer) : '—'}</div>
                    </div>
                    <div style="${{textAlign:'right'}}">
                      <div style="${{fontSize:'0.7rem', color:'#F59E0B', fontWeight:700}}">THEIR ASK</div>
                      <div style="${{fontSize:'1.3rem', fontWeight:700}}">${sOffer ? formatMoney(sOffer) : '—'}</div>
                    </div>
                  </div>
                  <div className="slider-rail">
                    ${bOffer && html`<div className="slider-dot buyer" style="${{left: `${bPct}%`}}"></div>`}
                    ${sOffer && html`<div className="slider-dot seller" style="${{left: `${sPct}%`}}"></div>`}
                  </div>
                  ${bOffer && sOffer && html`<div style="${{textAlign:'center', fontSize:'0.8rem', color:'#6B7280', marginTop:'1.5rem'}}">Gap to close: ${formatMoney(sOffer - bOffer)}</div>`}
                </div>
                
                <div className="widget">
                  <h4>At the table</h4>
                  <div style="${{display:'flex', justifyContent:'space-between', borderBottom:'1px solid #F3F4F6', paddingBottom:'0.5rem', marginBottom:'0.5rem'}}">
                    <span style="${{color:'#6B7280', fontSize:'0.9rem'}}">To move</span>
                    <span style="${{fontWeight:700, fontSize:'0.9rem', color: session.turn==='buyer'?'#10B981':'#F59E0B'}}">${session.turn==='buyer' ? 'Your Agent' : 'Cornerstone'}</span>
                  </div>
                  <div style="${{display:'flex', justifyContent:'space-between', borderBottom:'1px solid #F3F4F6', paddingBottom:'0.5rem', marginBottom:'0.5rem'}}">
                    <span style="${{color:'#6B7280', fontSize:'0.9rem'}}">Round</span>
                    <span style="${{fontWeight:700, fontSize:'0.9rem'}}">${session.exchange} / ${session.max_rounds}</span>
                  </div>
                  <div style="${{display:'flex', justifyContent:'space-between'}}">
                    <span style="${{color:'#6B7280', fontSize:'0.9rem'}}">Your side</span>
                    <span style="${{fontWeight:700, fontSize:'0.9rem'}}">${session.mode.buyer === 'auto' ? 'Agent' : 'Manual'}</span>
                  </div>
                </div>
                
                <div className="widget">
                  <h4>Live Negotiation</h4>
                  ${!isEnded ? html`
                    ${session.awaiting_human ? html`
                      <textarea placeholder="Type your counter..." value="${humanMsg}" onChange="${e=>setHumanMsg(e.target.value)}" style="${{height:'80px', background:'#FFFFFF'}}"></textarea>
                      <button className="btn" style="${{background:'#6B7280', color:'white', marginBottom:'0.5rem'}}" onClick="${sendMsg}">Send message</button>
                      <button className="btn btn-primary" style="${{background:'transparent', color:'#6B7280', border:'1px solid #E5E7EB'}}" onClick="${()=>intervene('return_to_ai')}">Resume Agent</button>
                    ` : html`
                      <button className="btn" style="${{background:'#6B7280', color:'white', marginBottom:'0.5rem'}}" onClick="${advance}" disabled="${loading}">
                        ${loading ? 'Thinking...' : '▶ Resume (1 turn)'}
                      </button>
                      <button className="btn btn-primary" style="${{background:'transparent', color:'#6B7280', border:'1px solid #E5E7EB'}}" onClick="${()=>intervene('take_over')}" disabled="${loading}">
                        Take over as buyer
                      </button>
                    `}
                  ` : html`
                    <div style="${{textAlign:'center', color:'#6B7280'}}">Session concluded.</div>
                  `}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    return null;
  }

  const root = createRoot(document.getElementById('root'));
  root.render(html`<${App} />`);
</script>
</body>
</html>
